name: Alpha Velocity Tests

on:
  push:
    branches: [main, research, production]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Compile source
        shell: pwsh
        run: |
          python -m compileall alpha_velocity
